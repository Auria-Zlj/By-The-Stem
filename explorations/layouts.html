<title>By the Stem Layouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Patrick+Hand&display=swap">
<style>
/* Layout: a contact sheet of five page layouts, two to a row, each drawn at the same 960×600 size. Single light look: ink on paper. */
:root{--ink:#394038;--muted:#7A8077;--bg:#F5F5F1;--sheet:#FCFCFA;--twine:#B4593F;
  --f-hand:"Nanum Pen Script","Bradley Hand",cursive;--f-ui:"Patrick Hand","Comic Neue",cursive}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.35}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:32px 64px}
h1{font:400 56px/1 var(--f-hand);margin:0}
.lede{margin:8px 0 28px;color:var(--muted);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}
figure{margin:0;display:grid;gap:10px}
figure svg{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid #E3E2DB;border-radius:4px}
figcaption{display:grid;gap:2px}
figcaption b{font:400 30px/1 var(--f-hand)}
figcaption span{color:var(--muted);font-size:17px}
.under path{fill:#FAF6EE}
.h{font-family:var(--f-hand)}
.u{font-family:var(--f-ui)}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>

  <h2 class="h" style="font-weight:400;font-size:40px;margin:48px 0 14px">Round one</h2>

function E1(){let o=sign(48,72,44)+T(48,100,'Flowers by the stem.',15);
  o+=T(60,166,'today’s stems',30,'h')+ln([[60,176],[300,174]],'stroke="#B4593F"');
  SH.forEach((k,i)=>{const y=222+i*42;if(i===0)o+=`<rect x="56" y="${y-16}" width="${NM[k][0].length*9.5+12}" height="12" fill="#F4C9A6" opacity=".8" transform="rotate(-1 56 ${y})"/>`;o+=menuRow(62,y,k,270)});
  o+=T(66,580,'← p. 1 of 2 →',18,'h','start',0,'#7A8077');
  o+=stem('rose',470,548,400,0,301)+T(470,580,'Rose · deep red, opens slowly',16,'u','middle',0,'#7A8077');
  o+=paperBunch(790,240,200,260,-5,.85)+noteTotal(680,430,230);
  return frame(o)}

/* E2: fewer rows, each led by a big flower head */
function E2(){let o=sign(48,72,44)+T(48,100,'Flowers by the stem.',15);
  o+=T(60,160,'today’s stems',30,'h');
  SH.slice(0,6).forEach((k,i)=>{const y=218+i*62;o+=head(k,96,y-8,58,310+i)+menuRow(140,y,k,300,24)});
  o+=T(140,600-10,'p. 1 of 3 →',18,'h','start',0,'#7A8077');
  o+=paperBunch(700,270,230,300,-5,.95)+noteTotal(590,460,250);
  return frame(o)}

/* E3: no pictures in the list; each name gets a swash in its own colour */
function E3(){let o=sign(48,72,44)+T(48,100,'Flowers by the stem.',15);
  o+=T(60,160,'today’s stems',30,'h');
  SH.forEach((k,i)=>{const y=216+i*46,[n,p]=NM[k];o+=`<path d="M58 ${y+5} C${90} ${y+1} ${60+n.length*13} ${y+7} ${66+n.length*14} ${y+2}" fill="none" stroke="${HUE[k]}" stroke-width="9" stroke-linecap="round" opacity=".85"/>`+T(62,y,n,30,'h')+T(360,y,p,28,'h','end')});
  o+=stem('tul',470,500,300,-8,320)+stem('hyd',520,520,280,10,321);
  o+=paperBunch(790,250,200,260,-5,.85)+noteTotal(680,430,230);
  return frame(o)}

const CONE=[

];

const fig=([t,d,fn])=>{SEED=7;return `<figure>${fn()}<figcaption><b>${t}</b><span>${d}</span></figcaption></figure>`};
document.getElementById('gridE').innerHTML=CONE.map(fig).join('');
document.getElementById('grid2').innerHTML=CON2.map(fig).join('');
