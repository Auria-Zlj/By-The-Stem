<title>By the Stem Papers and Cards</title>

<style>
/* Layout: a reference sheet. Textured wrapping papers four to a row, then card styles four to a row. Ink on paper, one light look. */
:root{--ink:#394038;--muted:#7A8077;--bg:#F5F4EF;--sheet:#FCFCFA;--twine:#B4593F;
  --f-hand:"Nanum Pen Script","Bradley Hand",cursive;--f-ui:"Patrick Hand","Comic Neue",cursive}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.35}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:32px 72px}
h1{font:400 56px/1 var(--f-hand);margin:0}
h2{font:400 40px/1 var(--f-hand);margin:44px 0 6px}
.lede{margin:8px 0 0;color:var(--muted);max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px;margin-top:18px}
#papers{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){#papers{grid-template-columns:repeat(2,minmax(0,1fr))}}
figure{margin:0;display:grid;gap:8px}
figure svg{width:100%;height:auto;display:block;background:var(--sheet);border:1px solid #E3E2DB;border-radius:4px}
figcaption{display:grid;gap:2px}
figcaption b{font:400 28px/1 var(--f-hand)}
figcaption span{color:var(--muted);font-size:16px}
.h{font-family:var(--f-hand)}.u{font-family:var(--f-ui)}
.under path{fill:#FAF6EE}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>

const MAIN={ran:'pink',tul:'apricot',fre:'cream',sna:'lav',lil:'lily',ane:'white',pea:'pea',cal:'white',car:'carn',rose:'rose',hyd:'hyd',all:'allium',bun:'oat',gyp:'gyp',del:'delph',peo:'peony',dah:'dahlia'};
function draw(k,s,strip,col){
  const key=k+s+(strip?'s':'')+(col||'');if(CACHE.has(key))return CACHE.get(key);
  const g=(seed,amt)=>{const K=kit(seed,amt,strip);GEN[k](K);return K.out};
