<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bench Layout Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Patrick+Hand&display=swap">
<style>
:root{--ink:#394038;--muted:#7A8077;--twine:#B4593F;--page:#F4F2EC}
body{margin:0;background:var(--page);color:var(--ink);font:18px/1.35 "Patrick Hand",cursive;padding:28px max(16px,4vw) 60px}
h1{font:400 52px/1 "Nanum Pen Script",cursive;margin:0 0 6px}
p.lead{margin:0 0 24px;color:var(--muted);max-width:70ch}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:34px 28px;max-width:1500px}
figure{margin:0;display:grid;gap:10px}
img{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 1px 0 rgba(57,64,56,.08),0 10px 28px rgba(57,64,56,.10)}
figcaption b{display:block;font:400 32px/1 "Nanum Pen Script",cursive;color:var(--twine);margin-bottom:2px}
figcaption span{color:var(--muted);font-size:16px}
</style></head><body>
